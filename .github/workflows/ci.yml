name: CI

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/dependabot.yml
      - .github/workflows/**
      - .nvmrc
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - sdks/typescript/package.json
      - sdks/typescript/examples/package.json
      - sdks/python/pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check automation before package bootstrap
        run: python3 ./scripts/ci/test-automation-contracts.py

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24.19.0
          install: false
          cache: true

      - name: Verify TypeScript package
        run: ./scripts/ci/verify-typescript-package.sh

  python:
    name: Python package
    runs-on: ubuntu-latest
    outputs:
      dist-inventory: ${{ steps.inventory.outputs.inventory }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: auto
          prune-cache: false

      - name: Verify Python package
        run: ./scripts/ci/verify-python-package.sh

      - name: Record producer distribution inventory
        id: inventory
        run: |
          inventory="$(python3 scripts/ci/python-dist-inventory.py create sdks/python/dist)"
          printf 'inventory=%s\n' "$inventory" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$inventory"

      - name: Upload verified Python distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: sdks/python/dist/*
          if-no-files-found: error
          archive: true
          retention-days: 1

  python-artifact-roundtrip:
    name: Python artifact roundtrip
    needs: python
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Download verified Python distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist
          skip-decompress: false
          digest-mismatch: error

      - name: Verify producer inventory and package archives
        env:
          PYTHON_DIST_INVENTORY: ${{ needs.python.outputs.dist-inventory }}
        run: python3 scripts/ci/python-dist-inventory.py verify dist
